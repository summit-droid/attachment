<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    if (!localStorage.getItem('loggedIn')) {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body>
  <header><h1>User Management System</h1></header>
  <nav>
    <button onclick="logout()">Logout</button>
    <a href="register.html"><button>Register</button></a>
  </nav>

  <section id="form-section">
    <h2>Register User</h2>
    <form id="userForm">
      <input type="text" name="name" placeholder="Name" required><br>
      <input type="number" name="age" placeholder="Age" required><br>
      <input type="text" name="gender" placeholder="Gender" required><br>
      <input type="text" name="contact" placeholder="Contact" required><br>
      <input type="text" name="username" placeholder="Username" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Submit</button>
    </form>
  </section>

  <section id="user-list">
    <h2>User List</h2>
    <input type="text" id="search" placeholder="Search by name or ID...">
    <ul id="users"></ul>
  </section>

  <section id="stats">
    <h2>User Stats</h2>
    <canvas id="userChart" width="400" height="200"></canvas>
  </section>

  <footer><p>&copy; 2025 Douglas mwangi</p></footer>

  <script src="script.js"></script>
  <script>
    function logout() {
      localStorage.removeItem('loggedIn');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
